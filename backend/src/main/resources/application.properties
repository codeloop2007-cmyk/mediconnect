spring.application.name=mediconnect-backend

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration (Neon)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-rough-frog-azx7t2xh-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_lrc71JDWBytA}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SpringDoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9f2c7a1e8b4d6035a7c9e2f1b6d8a0435c7e9f2a1b4d6083e6c9a2f7b5d1048}
app.jwt.expiration-ms=86400000

# Logging Configuration
logging.level.com.mediconnect.backend=DEBUG
logging.level.org.springframework.security=INFO